name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Generated types are up to date
        run: |
          bun run gen:types
          git diff --exit-code -- src/core/import/parts-export.v1.generated.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E (Playwright against vite preview)
        run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cut-optimizer:ci .

      - name: Image serves the app
        run: |
          docker run -d --name app -p 8080:80 cut-optimizer:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ | grep -q '<title>Cut Optimizer</title>'; then
              echo "served"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
