<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cut Optimizer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --text: #1a1a1a;
        --ref: #8a8a8a;
        --part: #1f5f99;
        --part-bg: #dbe9f6;
        --flip-bg: #a9c6e3;
        --blank-bg: #f6f3ec;
        --saw-bg: #e3f0d9;
        --offcut-bg: #fbf3d5;
        --waste-bg: #ececec;
        --cut: #c0392b;
        --warn: #b35900;
        --error: #b00020;
        --warn-bg: #fff4d6;
        --warn: #8a5a00;
        --muted: #777;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --text: #eee;
          --ref: #888;
          --part: #8cc0ef;
          --part-bg: #1d3347;
          --flip-bg: #35587d;
          --blank-bg: #2a2722;
          --saw-bg: #233522;
          --offcut-bg: #3a3420;
          --waste-bg: #222;
          --cut: #ff7a6b;
          --warn: #ffb066;
          --error: #ff6b81;
          --warn-bg: #3a2f12;
          --warn: #f2c66d;
          --muted: #999;
        }
      }
      body {
        margin: 0 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      .error {
        color: var(--error);
      }
      .warning-box {
        background: var(--warn-bg);
        color: var(--warn);
        padding: 0.5rem 1rem;
        border-radius: 4px;
      }
      .raw-name {
        color: var(--muted);
        font-size: 0.75rem;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.15rem 0.75rem 0.15rem 0;
        vertical-align: top;
      }
      figure {
        margin: 1rem 0;
      }
      .warn {
        color: var(--warn);
      }
      svg {
        max-width: 100%;
        height: auto;
      }
      table {
        border-collapse: collapse;
        margin: 0.5rem 0;
      }
      th,
      td {
        text-align: left;
        padding: 2px 8px;
        border-bottom: 1px solid var(--waste-bg);
      }
      .step-choice {
        margin-right: 1rem;
        font-size: 1.25rem;
      }
      .scan-video {
        display: block;
        width: 100%;
        max-width: 480px;
      }
      .scan-feedback {
        margin: 1rem 0;
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 4px solid var(--waste-bg);
        font-size: 1.5rem;
      }
      .scan-feedback p {
        margin: 0.25rem 0;
      }
      .scan-feedback.ok {
        border-color: var(--part);
        background: var(--saw-bg);
      }
      .scan-feedback.warn {
        border-color: var(--warn);
        background: var(--warn-bg);
      }
      .scan-feedback.error {
        border-color: var(--error);
        color: var(--error);
      }
      .scan-headline {
        font-size: 2.5rem;
        font-weight: bold;
      }
      .scan-part {
        font-size: 2rem;
      }
      .scan-where {
        font-family: ui-monospace, monospace;
      }
      .scan-warning {
        color: var(--warn);
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
