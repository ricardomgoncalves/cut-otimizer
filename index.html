<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cut Optimizer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --text: #1a1a1a;
        --ref: #8a8a8a;
        --part: #1f5f99;
        --part-bg: #dbe9f6;
        --blank-bg: #f6f3ec;
        --error: #b00020;
        --warn-bg: #fff4d6;
        --warn: #8a5a00;
        --muted: #777;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --text: #eee;
          --ref: #888;
          --part: #8cc0ef;
          --part-bg: #1d3347;
          --blank-bg: #2a2722;
          --error: #ff6b81;
          --warn-bg: #3a2f12;
          --warn: #f2c66d;
          --muted: #999;
        }
      }
      body {
        margin: 0 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      .error {
        color: var(--error);
      }
      .warning-box {
        background: var(--warn-bg);
        color: var(--warn);
        padding: 0.5rem 1rem;
        border-radius: 4px;
      }
      .raw-name {
        color: var(--muted);
        font-size: 0.75rem;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 0.15rem 0.75rem 0.15rem 0;
        vertical-align: top;
      }
      figure {
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
